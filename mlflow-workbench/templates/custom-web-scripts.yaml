apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-web-scripts
  namespace: {{ .Release.Namespace }}
data:
  custom.css: |
{{- if not ( empty .Values.branding.custom_css ) }}
{{-  .Values.branding.custom_css | nindent 4 }}
{{- else }}
    :root {
        --ui-orange: #ff985b;
        --ui-white: #ffffff;
        --ui-purple: #cc3ec6;

        --ui-gradient: linear-gradient(
            90deg,
            var(--ui-purple) 0%,
            var(--ui-orange) 100%
        );
    }

    /* Main application */
    body,
    #main,
    .jp-LabShell,
    .jp-MainAreaWidget,
    .jp-Activity,
    .lm-BoxPanel,
    .lm-DockPanel,
    .lm-SplitPanel,
    .lm-TabPanel,
    .lm-StackedPanel {
        background: var(--ui-gradient) !important;
    }

    /* Toolbars */
    .jp-Toolbar,
    .jp-NotebookPanel-toolbar {
        background: var(--ui-gradient) !important;
    }


    /* Command palette */
    .lm-CommandPalette {
        background: var(--ui-gradient) !important;
    }

    /* splitters and separators in navigation */
    .lm-SplitPanel-handle {
        background: var(--ui-gradient) !important;
    }

    /* buttons above navigation */
    .jp-ToolbarButton{
        background: var(--ui-white) !important;
    }

    /* right */
    .jp-mod-right {
        background: var(--ui-orange) !important;
    }

    /* left */
    .jp-mod-left {
        background: var(--ui-purple) !important;
    }
    
    /* bottom */
    #jp-bottom-panel,
    #jp-main-statusbar {
        background: var(--ui-gradient) !important;
    }
    
    /* top */
    #jp-menu-panel{
        background: var(--ui-white) !important;
    }

    #jp-top-bar{
        background: var(--ui-gradient) !important;
    }

    /* custom inner logo */
    #jp-MainLogo > svg {
        display: none;
    }

